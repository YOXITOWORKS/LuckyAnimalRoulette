    // サウンド合成用（電子音）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration, vol) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const config = {
        type: Phaser.AUTO, width: 360, height: 180,
        parent: 'game-container', backgroundColor: '#0d0d0d',
        scene: { create: create }
    };

    const game = new Phaser.Game(config);
    let reels = [];
    let isSpinning = false;
    let nextImage = new Image();

    function create() {
        const scene = this;
        scene.add.rectangle(180, 50, 280, 70, 0x000000).setStrokeStyle(2, 0xffd700).setOrigin(0.5);
        for (let i = 0; i < 4; i++) {
            reels.push(scene.add.text(85 + (i * 63), 50, '0', { fontSize: '65px', fill: '#555555', fontStyle: 'bold' }).setOrigin(0.5));
        }

        const spinBtn = scene.add.rectangle(180, 135, 180, 45, 0xff4500).setInteractive({ useHandCursor: true });
        const btnTxt = scene.add.text(180, 135, 'SPIN', { fontSize: '20px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        spinBtn.on('pointerdown', () => {
            if (isSpinning) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const keys = Object.keys(ANIMAL_DATA);
            if (keys.length === 0) return;

            isSpinning = true;
            document.getElementById('result-panel').classList.remove('show');
            document.getElementById('animal-image').style.display = 'none';
            document.getElementById('loading-text').style.display = 'block';
            btnTxt.setText('ROLLING...');

            const finalNum = keys[Math.floor(Math.random() * keys.length)];
            const imageId = IMAGE_MAP[finalNum];
            if (imageId) nextImage.src = `https://lh3.googleusercontent.com/d/${imageId}`;
            
            scene.tweens.addCounter({
                from: 0, to: 100, duration: 1500,
                onUpdate: (tween) => {
                    reels.forEach(r => {
                        r.setText(Math.floor(Math.random() * 10)).setFill('#ffd700');
                    });
                    // スピン中のピコピコ音（適度な間隔で）
                    if (Math.random() > 0.8) playSound(880, 'square', 0.05, 0.05);
                },
                onComplete: () => {
                    for (let i = 0; i < 4; i++) {
                        reels[i].setText(finalNum[i]).setFill('#ffffff');
                    }
                    // 確定時のファンファーレ音
                    playSound(523.25, 'sine', 0.2, 0.1); // ド
                    setTimeout(() => playSound(659.25, 'sine', 0.2, 0.1), 100); // ミ
                    setTimeout(() => playSound(783.99, 'sine', 0.4, 0.1), 200); // ソ
                    
                    showResult(finalNum);
                    btnTxt.setText('SPIN');
                    isSpinning = false;
                }
            });
        });
    }

    function showResult(num) {
        const data = ANIMAL_DATA[num];
        if (!data) return;

        document.getElementById('default-message').style.display = 'none';
        document.getElementById('res-num').innerText = "NO. " + num;
        document.getElementById('res-jp').innerText = data.jp || "";
        document.getElementById('res-en').innerText = data.en || "";
        
        const buyBtn = document.getElementById('buy-button');
        buyBtn.style.display = (data.url && data.url.startsWith('http')) ? 'inline-block' : 'none';
        if (buyBtn.style.display === 'inline-block') buyBtn.href = data.url;

        const imgEl = document.getElementById('animal-image');
        const loadingEl = document.getElementById('loading-text');

        const displayImage = () => {
            loadingEl.style.display = 'none';
            imgEl.src = nextImage.src;
            imgEl.style.display = 'block';
            document.getElementById('result-panel').classList.add('show');
        };

        if (nextImage.complete) {
            displayImage();
        } else {
            nextImage.onload = displayImage;
            setTimeout(() => {
                if (imgEl.style.display === 'none') {
                    loadingEl.style.display = 'none';
                    document.getElementById('result-panel').classList.add('show');
                }
            }, 1500); 
        }
    }
